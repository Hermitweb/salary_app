<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工资查询系统 - 登录</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .login-container {
            background: #fff;
            border-radius: 8px;
            padding: 48px 40px;
            width: 400px;
            max-width: 90%;
            border: 1px solid #e8ecf1;
        }
        @media (max-width: 768px) {
            .login-container {
                padding: 36px 24px;
                width: 100%;
                max-width: 100%;
                border-radius: 0;
                border: none;
                min-height: 100vh;
            }
            body { align-items: flex-start; }
            .logo { margin-bottom: 28px; }
            .login-btn { padding: 14px; font-size: 16px; }
            .form-group input { padding: 14px; font-size: 16px; }
        }
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: #f0f4f8;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 24px;
        }
        .logo h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a2332;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .logo p {
            font-size: 13px;
            color: #8a99ab;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #5a6a7a;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dde3ea;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: #fafbfc;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .info-msg {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .pwd-hint {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            color: #64748b;
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 16px;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: #2563eb;
        }
        .login-btn:active {
            background: #1d4ed8;
        }
        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #a0aec0;
        }
        .warning-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 8px 16px;
            background: #fef2f2;
            border-top: 1px solid #fecaca;
            color: #b91c1c;
            font-size: clamp(10px, 1.4vw, 14px);
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 1px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <!-- 工资条文档 -->
                    <rect x="5" y="4" width="22" height="24" rx="2.5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
                    <!-- 文档顶部的横线（标题栏） -->
                    <line x1="9" y1="10" x2="23" y2="10" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round"/>
                    <line x1="9" y1="14" x2="19" y2="14" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
                    <line x1="9" y1="17.5" x2="17" y2="17.5" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
                    <!-- ¥ 符号（用路径绘制，避免字体兼容问题） -->
                    <path d="M13 21 L16 23.5 L19 21" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <line x1="13.2" y1="24.5" x2="18.8" y2="24.5" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
                    <line x1="16" y1="23.5" x2="16" y2="26.5" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>工资查询系统</h1>
            <p>Salary Query System</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        {% if expired %}
        <div class="info-msg">登录状态已过期，请重新登录</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" placeholder="请输入账号" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="login-btn">登录</button>
        </form>

        <div class="pwd-hint">
            初始密码为 HR 登记的紧急联系人号码<br>
            忘记密码请联系管理员重置
        </div>

        <div class="footer">
            © 2026 工资查询系统
        </div>
    </div>
    <div class="warning-bar">⚠ 薪资保密，请勿讨论，违者按公司制度处理</div>
</body>
</html>
