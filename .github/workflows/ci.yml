name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.85"

jobs:
  # 后端：格式、lint、测试、构建
  backend:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-action@stable
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt, clippy

    - name: Fetch dependencies
      run: cargo fetch --locked

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Generate sample data
      run: python scripts/generate_sample_data.py --data-dir data

    - name: Run tests
      run: cargo test --workspace --locked

    - name: Build release binary
      run: cargo build --release --bin salary-app-backend --locked

    - name: Build release tray
      run: cargo build --release -p salary-tray --locked

    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: salary-app-backend-windows
        path: target/release/salary-app-backend.exe
        retention-days: 7

    - name: Upload tray artifact
      uses: actions/upload-artifact@v4
      with:
        name: salary-tray-windows
        path: target/release/salary-tray.exe
        retention-days: 7

  # 前端：类型检查与构建
  frontend:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: src-tauri

    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: src-tauri/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: salary-app-frontend
        path: src-tauri/dist
        retention-days: 7

  # 依赖漏洞扫描
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-action@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Audit dependencies
      run: cargo audit
